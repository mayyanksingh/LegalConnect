<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=frontend/index.html">
  <title>LegalConnect | AI-Powered Legal Practice Management & Assistance System</title>
  <link rel="icon" type="image/svg+xml" href="frontend/assets/favicon.svg">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #060d1d;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
    }
    .redirect-card {
      background: #0b1528;
      border: 1px solid rgba(212, 175, 81, 0.3);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 480px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    h1 {
      color: #d4af51;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    a.btn {
      display: inline-block;
      background: linear-gradient(135deg, #d4af51 0%, #c5a039 100%);
      color: #060d1d;
      padding: 0.8rem 1.8rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 8px;
      transition: transform 0.2s;
    }
    a.btn:hover {
      transform: translateY(-2px);
    }
  </style>
  <script>
    // Immediate JavaScript redirection to frontend portal
    window.location.replace("frontend/index.html");
  </script>
</head>
<body>
  <div class="redirect-card">
    <h1>LegalConnect</h1>
    <p>Opening LegalConnect Legal Practice Management & Assistance System...</p>
    <a href="frontend/index.html" class="btn">Enter LegalConnect Portal</a>
  </div>
</body>
</html>
